<template>
  <style>

    @font-face { font-family: "Figtree"; src: url("assets/fonts/figtree.ttf"); font-weight: 300 900; }

  </style>
  <div id="root" data-composition-id="intro" data-width="1080" data-height="1920">
    <div id="intro-bg"></div>
    <canvas id="intro-dust" width="1080" height="1920"></canvas>
    <div id="intro-stage">
      <div id="intro-glow"></div>
      <svg id="intro-mark" viewBox="22 22 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="intro-g1" gradientUnits="userSpaceOnUse" x1="30" y1="30" x2="60" y2="80"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F1F4"/></linearGradient>
          <linearGradient id="intro-g2" gradientUnits="userSpaceOnUse" x1="20" y1="55" x2="80" y2="80"><stop offset="0" stop-color="#DEDEE3"/><stop offset="1" stop-color="#C9C9CF"/></linearGradient>
          <linearGradient id="intro-g3" gradientUnits="userSpaceOnUse" x1="20" y1="65" x2="80" y2="90"><stop offset="0" stop-color="#B8B8BF"/><stop offset="1" stop-color="#9C9CA4"/></linearGradient>
          <linearGradient id="intro-g4" gradientUnits="userSpaceOnUse" x1="60" y1="40" x2="60" y2="62"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6E6EA"/></linearGradient>
          <clipPath id="intro-clip"><path d="M75.65,64.10 A25.9,25.9 0 1,1 56.75,28.58 A20.9,20.9 0 1,0 75.65,64.10 Z"/></clipPath>
        </defs>
        <path id="intro-moon" d="M75.65,64.10 A25.9,25.9 0 1,1 56.75,28.58 A20.9,20.9 0 1,0 75.65,64.10 Z" fill="url(#intro-g1)"/>
        <g clip-path="url(#intro-clip)">
          <path id="intro-wave-1" d="M18,49 C26,59 38,66 52,69.5 C64,72 76,70 88,62 L88,98 L18,98 Z" fill="url(#intro-g2)"/>
          <path id="intro-wave-2" d="M18,61 C27,71 40,77.5 54,79 C66,80 77,76 88,69 L88,98 L18,98 Z" fill="url(#intro-g3)"/>

        <path class="intro-bar" id="intro-bar-1" d="M55.30,46.70 A1.7,1.7 0 0,1 58.70,46.70 L58.70,56.30 A1.7,1.7 0 0,1 55.30,56.30 Z" fill="url(#intro-g4)"/>
        <path class="intro-bar" id="intro-bar-2" d="M60.90,43.20 A1.7,1.7 0 0,1 64.30,43.20 L64.30,59.80 A1.7,1.7 0 0,1 60.90,59.80 Z" fill="url(#intro-g4)"/>
        <path class="intro-bar" id="intro-bar-3" d="M66.50,46.70 A1.7,1.7 0 0,1 69.90,46.70 L69.90,56.30 A1.7,1.7 0 0,1 66.50,56.30 Z" fill="url(#intro-g4)"/>
        <path class="intro-bar" id="intro-bar-4" d="M72.10,49.45 A1.7,1.7 0 0,1 75.50,49.45 L75.50,53.55 A1.7,1.7 0 0,1 72.10,53.55 Z" fill="url(#intro-g4)"/>

  <script>
    (function () {
      // Closed-form spring (damping ratio z): renders any frame on its own.
      const spring = (z, w = 11) => (t) => {
        if (t >= 1) return 1;
        const wd = w * Math.sqrt(1 - z * z);
        return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + ((z * w) / wd) * Math.sin(wd * t));
      };
      // Seeded dust, drawn as a function of time.
      let seed = 11;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
      const motes = Array.from({ length: 70 }, () => ({
        x: rnd() * 1080, y: rnd() * 1920, r: 0.6 + rnd() * 1.8, d: 0.3 + rnd() * 0.7, a: 0.15 + rnd() * 0.45,
      }));
      const ctx = document.getElementById("intro-dust").getContext("2d");
      const clock = { t: 0 };
      const draw = () => {
        const t = clock.t;
        ctx.clearRect(0, 0, 1080, 1920);
        const fade = Math.min(1, t / 2) * (t > 5.6 ? Math.max(0, 1 - (t - 5.6) / 0.8) : 1);
        for (const m of motes) {
          const y = (((m.y - t * 18 * m.d) % 1920) + 1920) % 1920;
          const x = m.x + (t * 22 * m.d * (t > 5.3 ? 1 + (t - 5.3) * 6 : 1)) * ((m.x - 540) / 540);
          ctx.globalAlpha = m.a * fade;
          ctx.fillStyle = "#e9e6ff";
          ctx.beginPath();
          ctx.arc(x, y, m.r * m.d * 1.6, 0, Math.PI * 2);
          ctx.fill();
        }
      };

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: 6.8, duration: 6.8, ease: "none", onUpdate: draw }, 0);

      // Light blooms out of the dark.
      tl.fromTo("#intro-glow", { opacity: 0, scale: 0.6 }, { opacity: 0.7, scale: 1, duration: 2.6, ease: "power2.inOut" }, 0);

      // The mark assembles: moon, then the waves rise into it, then the bars.
      tl.fromTo("#intro-mark", { opacity: 0, filter: "blur(16px)", scale: 0.9 },
        { opacity: 1, filter: "blur(0px)", scale: 1, duration: 1.7, ease: "expo.out" }, 0.45);
      tl.fromTo("#intro-wave-1", { y: 26 }, { y: 0, duration: 1.4, ease: "power3.out" }, 1.15);
      tl.fromTo("#intro-wave-2", { y: 26 }, { y: 0, duration: 1.4, ease: "power3.out" }, 1.32);
      [2, 1, 3, 0, 4].forEach((b, i) => {
        tl.fromTo(`#intro-bar-${b}`, { scaleY: 0, transformOrigin: "50% 50%" },
          { scaleY: 1, duration: 0.8, ease: spring(0.72) }, 2.2 + i * 0.06);
      });
      tl.fromTo("#intro-glow", { opacity: 0.7 }, { opacity: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, 2.62);
      tl.fromTo("#intro-glow", { opacity: 1 }, { opacity: 0.8, duration: 1.2, ease: "power2.inOut", immediateRender: false }, 2.97);

      // The name, letter by letter; then the line, word by word.
      tl.fromTo("#intro-word span", { opacity: 0.0, filter: "blur(10px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out", stagger: 0.07 }, 2.7);
      tl.fromTo("#intro-tag span", { opacity: 0, filter: "blur(7px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out", stagger: 0.09 }, 3.75);

      // A slow push while it holds, then through the moon.
      tl.fromTo("#intro-stage", { scale: 1, transformOrigin: "504px 470px" },
        { scale: 1.04, duration: 5.3, ease: "power1.inOut" }, 0);
      tl.fromTo(["#intro-tag span", "#intro-word span"], { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(8px)", duration: 0.22, stagger: 0.03, ease: "power2.in", immediateRender: false }, 5.2);
      tl.fromTo("#intro-stage", { scale: 1.04 },
        { scale: 4.2, duration: 1.4, ease: "power3.in", immediateRender: false }, 5.4);
      tl.fromTo("#intro-stage", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power2.in" , immediateRender: false}, 6.05);

      window.__timelines["intro"] = tl;
    })();
  </script>
