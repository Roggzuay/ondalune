  <div id="root" data-composition-id="custom" data-width="1920" data-height="1080">

      <div id="custom-bg"></div>

      <div id="custom-dark" class="custom-flood"></div>

      <div id="custom-left" class="phone"><div class="screen"><img src="assets/screens/bloom_home.png" /></div></div>

      <div id="custom-q1" class="custom-quiet on-light" style="top: 630px"><span>Light,</span> <span>dark</span> <span>or</span> <span>pure-black</span> <span>AMOLED.</span></div>
      <div id="custom-caption"><span>Two</span> <span>styles.</span> <span>Nine</span> <span>fonts.</span> <span>Your</span> <span>colours.</span></div>
      <div id="custom-t2" class="custom-title on-light" style="top: 270px"><span>Navidrome,</span> <span>Jellyfin,</span> <span>OpenSubsonic</span> <span>and</span> <span>this</span> <span>phone.</span></div>
      <div id="custom-q2" class="custom-quiet on-light" style="top: 660px"><span>Offline</span> <span>downloads,</span> <span>background</span> <span>scans,</span> <span>smart</span> <span>shuffle.</span></div>
      <div id="custom-t3" class="custom-title"><span>Arrange</span> <span>Home</span> <span>your</span> <span>way.</span></div>

  <script>
    (function () {
      const spring = (z, w = 11) => (t) => {
        if (t >= 1) return 1;
        const wd = w * Math.sqrt(1 - z * z);
        return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + ((z * w) / wd) * Math.sin(wd * t));
      };
      const B = 60 / 83.35;
      const BAR = 4 * B;
      const tl = gsap.timeline({ paused: true });
      const wordsIn = (sel, at, gap = 0.09) =>
        tl.fromTo(`${sel} span`, { opacity: 0, filter: "blur(7px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.22, stagger: gap, ease: "power2.out" }, at);
      const wordsOut = (sel, at) =>
        tl.fromTo(`${sel} span`, { opacity: 1, filter: "blur(0px)" },
          { opacity: 0, filter: "blur(8px)", duration: 0.18, stagger: 0.03, ease: "power2.in", immediateRender: false }, at);
      const PC = "1340px 540px"; // the main phone's centre, where each colour change starts

      // Hidden until their moment.
      tl.fromTo([".custom-flood"], { clipPath: `circle(0px at ${PC})` }, { clipPath: `circle(0px at ${PC})`, duration: 0.01 }, 0);
      tl.fromTo("#custom-left, #custom-right", { x: 0, scale: 0.8, opacity: 0 }, { x: 0, scale: 0.8, opacity: 0, duration: 0.01 }, 0);
      tl.fromTo("#custom-src", { x: 1300 }, { x: 1300, duration: 0.01 }, 0);
      tl.fromTo("#custom-main", { x: 380 }, { x: 380, duration: 0.01 }, 0);

      // In: a pan from the right, matching the player's exit.
      tl.fromTo("#custom-world", { x: 760 }, { x: 0, duration: 0.75, ease: "power3.out" }, 0);
      wordsIn("#custom-t1", 0.5);

      // 1. Dark to light: the colour floods out of the phone, screen and room together.
      const F = 2 * B;
      tl.fromTo("#custom-light", { clipPath: `circle(0px at ${PC})` },
        { clipPath: `circle(2300px at ${PC})`, duration: 1.0, ease: "power2.inOut", immediateRender: false }, F);
      tl.fromTo("#custom-main-light", { clipPath: "circle(0% at 50% 50%)" },
        { clipPath: "circle(120% at 50% 50%)", duration: 0.7, ease: "power2.inOut" }, F);
      tl.fromTo("#custom-t1", { color: "#f4f2ee" }, { color: "#1b1720", duration: 0.6, ease: "power2.inOut" }, F + 0.25);
      wordsIn("#custom-q1", F + 0.75, 0.07);

      // The styles fan out from behind it.
      const T = 7 * B;
      wordsOut("#custom-q1", T - 0.3);
      wordsOut("#custom-t1", T - 0.18);
      tl.fromTo("#custom-main", { x: 380, scale: 1 }, { x: 0, scale: 0.86, duration: 0.9, ease: spring(0.82), immediateRender: false }, T);
      tl.fromTo("#custom-left", { x: 0, scale: 0.8, opacity: 0 }, { x: -480, scale: 0.86, opacity: 1, duration: 1.0, ease: spring(0.8), immediateRender: false }, T + 0.15);
      tl.fromTo("#custom-right", { x: 0, scale: 0.8, opacity: 0 }, { x: 480, scale: 0.86, opacity: 1, duration: 1.0, ease: spring(0.8), immediateRender: false }, T + 0.27);
      wordsIn("#custom-caption", T + 0.7, 0.08);

      // 2. Where the music comes from.
      const M = 11 * B;
      wordsOut("#custom-caption", M - 0.3);
      [["#custom-left", 0], ["#custom-main", 0.06], ["#custom-right", 0.12]].forEach(([s, d]) =>
        tl.fromTo(s, { xPercent: 0 }, { xPercent: -480, duration: 0.7, ease: "power3.in", immediateRender: false }, M - 0.35 + d));
      tl.fromTo("#custom-src", { x: 1300 }, { x: 380, duration: 1.1, ease: spring(0.82), immediateRender: false }, M + 0.1);
      wordsIn("#custom-t2", M + 0.35);
      wordsIn("#custom-q2", M + 1.0, 0.07);

      // 3. Back to dark, into the Home layout editor.
      const D = 16 * B;
      wordsOut("#custom-q2", D - 0.3);
      wordsOut("#custom-t2", D - 0.18);
      tl.fromTo("#custom-dark", { clipPath: `circle(0px at ${PC})` },
        { clipPath: `circle(2300px at ${PC})`, duration: 1.0, ease: "power2.inOut", immediateRender: false }, D);
      tl.fromTo("#custom-src-dark", { clipPath: "circle(0% at 50% 50%)" },
        { clipPath: "circle(120% at 50% 50%)", duration: 0.7, ease: "power2.inOut" }, D);
      wordsIn("#custom-t3", D + 0.45);
      wordsIn("#custom-q3", D + 1.0, 0.06);

      // Out: the phone sinks into depth.
      wordsOut("#custom-q3", 14.15);
      wordsOut("#custom-t3", 14.25);
      tl.fromTo("#custom-src", { scale: 1, opacity: 1, filter: "blur(0px)" },
        { scale: 0.72, opacity: 0, filter: "blur(10px)", duration: 0.7, ease: "power2.in", immediateRender: false }, 14.3);

      window.__timelines["custom"] = tl;
    })();
  </script>
