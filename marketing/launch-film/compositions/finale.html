          <linearGradient id="finale-g2" gradientUnits="userSpaceOnUse" x1="20" y1="55" x2="80" y2="80"><stop offset="0" stop-color="#DEDEE3"/><stop offset="1" stop-color="#C9C9CF"/></linearGradient>

          <clipPath id="finale-clip"><path d="M75.65,64.10 A25.9,25.9 0 1,1 56.75,28.58 A20.9,20.9 0 1,0 75.65,64.10 Z"/></clipPath>

  <script>
    (function () {
      const spring = (z, w = 11) => (t) => {
        if (t >= 1) return 1;
        const wd = w * Math.sqrt(1 - z * z);
        return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + ((z * w) / wd) * Math.sin(wd * t));
      };
      const B = 60 / 83.35;
      const BAR = 4 * B;

      let seed = 23;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
      const motes = Array.from({ length: 60 }, () => ({
        x: rnd() * 1920, y: rnd() * 1080, r: 0.6 + rnd() * 1.6, d: 0.3 + rnd() * 0.7, a: 0.12 + rnd() * 0.4,
      }));
      const ctx = document.getElementById("finale-dust").getContext("2d");
      const clock = { t: 0 };
      const draw = () => {
        const t = clock.t;
        ctx.clearRect(0, 0, 1920, 1080);
        const fade = Math.min(1, t / 1.5);
        for (const m of motes) {
          const y = (((m.y - t * 16 * m.d) % 1080) + 1080) % 1080;
          ctx.globalAlpha = m.a * fade;
          ctx.fillStyle = "#e9e6ff";
          ctx.beginPath();
          ctx.arc(m.x, y, m.r * m.d * 1.6, 0, Math.PI * 2);
          ctx.fill();
        }
      };

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: 8.81, duration: 8.81, ease: "none", onUpdate: draw }, 0);
      tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);

      // The line, then the lockup on the next bar.
      tl.fromTo("#finale-line span", { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.28, stagger: 0.12, ease: "power2.out" }, 0.35);
      tl.fromTo("#finale-line span", { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(8px)", duration: 0.2, stagger: 0.05, ease: "power2.in", immediateRender: false }, BAR - 0.45);

      const L = BAR;
      tl.fromTo("#finale-glow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.6, ease: "power2.out" }, L - 0.2);
      tl.fromTo("#finale-mark", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, L);
      tl.fromTo("#finale-moon", { scale: 0.85, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.9, ease: spring(0.78) }, L);
      tl.fromTo("#finale-wave-1", { x: -40 }, { x: 0, duration: 1.0, ease: "power3.out" }, L + 0.15);
      tl.fromTo("#finale-wave-2", { x: -40 }, { x: 0, duration: 1.0, ease: "power3.out" }, L + 0.27);
      [2, 1, 3, 0, 4].forEach((b, i) =>
        tl.fromTo(`#finale-bar-${b}`, { scaleY: 0, transformOrigin: "50% 50%" },
          { scaleY: 1, duration: 0.8, ease: spring(0.72) }, L + 0.5 + i * 0.06));
      tl.fromTo("#finale-word", { clipPath: "inset(0 100% 0 0)", x: -30 },
        { clipPath: "inset(0 0% 0 0)", x: 0, duration: 0.9, ease: "power3.out" }, L + 0.65);

      tl.fromTo("#finale-sub span", { opacity: 0, filter: "blur(7px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.24, stagger: 0.08, ease: "power2.out" }, L + 1.6);
      tl.fromTo("#finale-repo", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.6, ease: spring(0.85) }, L + 2.3);
      tl.fromTo("#finale-credits", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, L + 2.0);

      window.__timelines["finale"] = tl;
    })();
  </script>
