  <script>
    (function () {
      const spring = (z, w = 11) => (t) => {
        if (t >= 1) return 1;
        const wd = w * Math.sqrt(1 - z * z);
        return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + ((z * w) / wd) * Math.sin(wd * t));
      };
      const B = 60 / 83.35;
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#library-bg, #library-glow", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
      // Depth: the far covers drift less than the near ones while the camera glides.
      tl.fromTo("#library-far", { x: 40, opacity: 0 }, { x: -50, opacity: 1, duration: 9.24, ease: "power1.inOut" }, 0);
      tl.fromTo("#library-mid", { x: 120, opacity: 0 }, { x: -150, opacity: 1, duration: 9.24, ease: "power1.inOut" }, 0);
      tl.fromTo("#library-glow", { x: 0 }, { x: -80, duration: 9.24, ease: "power1.inOut" }, 0);

      // The phone emerges out of the moon's light, then glides right to make room for the line.
      tl.fromTo("#library-phone", { scale: 1.32, opacity: 0, filter: "blur(14px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 1.1, ease: "expo.out" }, 0);
      tl.fromTo("#library-phone", { x: 0 }, { x: 380, duration: 1.1, ease: spring(0.82) }, 1.25);

      // Title: "Your" and the rolling word arrive with the move.
      tl.fromTo("#library-your", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 1.55);
      tl.fromTo("#library-slot", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 1.65);
      tl.fromTo("#library-quiet span", { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.18, stagger: 0.07, ease: "power2.out" }, 2.1);

      // Screens change on beats: the new page slides in, the old one falls back.
      const at = [4, 6, 8, 10].map((b) => b * B);
      at.forEach((t, i) => {
        tl.fromTo(`#library-s${i + 1}`, { xPercent: 100 }, { xPercent: 0, duration: 0.55, ease: "power3.inOut" }, t);
        tl.fromTo(`#library-s${i}`, { xPercent: 0, opacity: 1 }, { xPercent: -30, opacity: 0.35, duration: 0.55, ease: "power3.inOut", immediateRender: false }, t);
        tl.fromTo("#library-words", { yPercent: -20 * i }, { yPercent: -20 * (i + 1), duration: 0.5, ease: "power3.inOut", immediateRender: false }, t + 0.03);
      });

      // A slow push while it plays.
      tl.fromTo("#library-phone", { y: 0 }, { y: -12, duration: 7, ease: "power1.inOut" }, 1.4);

      // Out: through the phone, toward the player.
      tl.fromTo(["#library-quiet span", "#library-slot", "#library-your"], { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(8px)", duration: 0.2, stagger: 0.04, ease: "power2.in", immediateRender: false }, 8.25);
      tl.fromTo("#library-phone", { scale: 1, filter: "blur(0px)" },
        { scale: 1.7, filter: "blur(16px)", duration: 0.75, ease: "power3.in", immediateRender: false }, 8.49);
      tl.fromTo("#library-phone", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, 8.84);
      tl.fromTo(".library-layer", { scale: 1 }, { scale: 1.35, duration: 0.75, ease: "power3.in", immediateRender: false }, 8.49);

      window.__timelines["library"] = tl;
    })();
