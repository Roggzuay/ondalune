name: Feature idea
description: Suggest something new or a change
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the idea and the moment you'd use it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
