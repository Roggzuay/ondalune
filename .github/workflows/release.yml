name: Release

# Push a tag like v1.0.0 to build a signed APK and attach it to a GitHub release.
# Needs four repository secrets: ONDALUNE_KEYSTORE_BASE64 (base64 of the .jks file),
# ONDALUNE_KEYSTORE_PASSWORD, ONDALUNE_KEY_ALIAS and ONDALUNE_KEY_PASSWORD.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install Android platform 37 (Android 17)
        run: sdkmanager "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ONDALUNE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        env:
          ONDALUNE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ONDALUNE_KEYSTORE_PASSWORD: ${{ secrets.ONDALUNE_KEYSTORE_PASSWORD }}
          ONDALUNE_KEY_ALIAS: ${{ secrets.ONDALUNE_KEY_ALIAS }}
          ONDALUNE_KEY_PASSWORD: ${{ secrets.ONDALUNE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Minutes since 2026-01-01 of the tagged commit: increases with every release and is
          # the same on every rebuild of the tag.
          CODE=$(( ( $(git log -1 --format=%ct) - 1767225600 ) / 60 ))
          ./gradlew assembleRelease --no-configuration-cache \
            -Pondalune.versionName="$VERSION" -Pondalune.versionCode="$CODE"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Ondalune-$VERSION.apk"
          (cd dist && sha256sum "Ondalune-$VERSION.apk" > "Ondalune-$VERSION.apk.sha256")

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
